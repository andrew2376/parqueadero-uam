services:
  base_datos:
    image: postgres:16-alpine
    container_name: parqueadero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: parqueadero
      POSTGRES_USER: parqueadero
      POSTGRES_PASSWORD: parqueadero_desarrollo
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parqueadero -d parqueadero"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  datos_postgres:
