name: Pruebas backend

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  pruebas:
    runs-on: ubuntu-latest

    env:
      url_base_datos: "postgresql://ci:ci@localhost:5432/parqueadero_ci"
      secreto_jwt: "secreto-de-prueba-para-ci-no-usar-en-produccion"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - run: ruff check app

      - run: pytest