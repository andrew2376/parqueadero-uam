[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "parqueadero-lpr-api"
version = "0.1.0"
description = "API del sistema de parqueadero LPR"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30", "pydantic-settings>=2.5", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "alembic>=1.13"]
[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["pruebas"]
[tool.ruff]
line-length = 100
target-version = "py312"
